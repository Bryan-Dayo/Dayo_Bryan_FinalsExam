<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Login</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body id="login-page" class="auth-page">

    <section class="auth-wrapper">

        <aside class="auth-hero">
            <h2 class="hero-title">Welcome back, student.</h2>
            <p class="hero-text">Log in with the email and password you registered with to open your student dashboard.</p>
        </aside>

        <article class="auth-card">
            <div class="brand">
                <img src="assets/images/logo.png" alt="Student Portal logo" class="brand-logo">
                <h1 class="brand-title">Student Portal</h1>
                <p class="brand-subtitle">Log in to continue</p>
            </div>

            <div class="form-group">
                <span class="field-label">Email</span>
                <input type="email" id="email" class="field-input" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <span class="field-label">Password</span>
                <input type="password" id="password" class="field-input" placeholder="Enter your password">
            </div>

            <p id="message" class="message"></p>

            <button type="button" id="loginBtn" class="btn btn-primary">Login</button>

            <p class="switch-text">
                Don't have an account?
                <a href="register.html" class="switch-link">Register here</a>
            </p>
        </article>

    </section>

    <script src="assets/script.js"></script>
</body>
</html>
