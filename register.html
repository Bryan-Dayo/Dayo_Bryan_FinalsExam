<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Register</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body id="register-page" class="auth-page">

    <section class="auth-wrapper">

        <aside class="auth-hero">
            <h2 class="hero-title">Create your student account.</h2>
            <p class="hero-text">Register once with your email, username, password, and student ID. After that, you can log in anytime.</p>
        </aside>

        <article class="auth-card">
            <div class="brand">
                <img src="assets/images/logo.png" alt="Student Portal logo" class="brand-logo">
                <h1 class="brand-title">Create Account</h1>
                <p class="brand-subtitle">Fill in your details below</p>
            </div>

            <div class="form-group">
                <span class="field-label">Email</span>
                <input type="email" id="email" class="field-input" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <span class="field-label">Username</span>
                <input type="text" id="username" class="field-input" placeholder="3 to 20 letters, numbers, or _">
            </div>

            <div class="form-group">
                <span class="field-label">Password</span>
                <input type="password" id="password" class="field-input" placeholder="At least 6 characters">
            </div>

            <div class="form-group">
                <span class="field-label">Student ID</span>
                <input type="text" id="studentId" class="field-input" placeholder="25-00000">
                <span class="hint">Format: 25-00000</span>
            </div>

            <p id="message" class="message"></p>

            <button type="button" id="registerBtn" class="btn btn-primary">Create account</button>

            <p class="switch-text">
                Already registered?
                <a href="index.html" class="switch-link">Back to login</a>
            </p>
        </article>

    </section>

    <script src="assets/script.js"></script>
</body>
</html>
